services:
  couchdb:
    image: couchdb:3.3
    container_name: mks-control-couchdb
    # Only reachable from the server itself (backend and backup use the Docker network)
    ports:
      - '127.0.0.1:5984:5984'
    environment:
      COUCHDB_USER: ${COUCHDB_USER:-admin}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD:-password}
    volumes:
      - couchdb_data:/opt/couchdb/data
      - couchdb_config:/opt/couchdb/etc/local.d
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:5984/_up']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - mks-network
    restart: unless-stopped

  backend:
    image: ghcr.io/${GITHUB_OWNER}/mks-control-backend:${TAG:-latest}
    container_name: mks-control-backend
    ports:
      - '3000:3000'
    environment:
      COUCHDB_URL: http://couchdb:5984
      COUCHDB_USER: ${COUCHDB_USER:-admin}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD:-password}
      COUCHDB_DB_NAME: ${COUCHDB_DB_NAME:-mks_members}
      ADMIN_TAG_UIDS: ${ADMIN_TAG_UIDS:-}
      PORT: '3000'
      SEED_DATA: ${SEED_DATA:-false}
      SHELLY_PASSWORD: ${SHELLY_PASSWORD:-}
      SHELLY_GEN1_USER: ${SHELLY_GEN1_USER:-admin}
      SHELLY_CALLBACK_URL: ${SHELLY_CALLBACK_URL:-}
      SHELLY_DISCOVERY_TOKEN: ${SHELLY_DISCOVERY_TOKEN:-}
      # Login (docs/auth-plan.md): key of the entrance reader and kiosk; without it nobody can
      # log in at the entrance
      ENTRANCE_KEY: ${ENTRANCE_KEY:-}
      SESSION_IDLE_TIMEOUT_MS: ${SESSION_IDLE_TIMEOUT_MS:-300000}
      SESSION_WEBNFC_MAX_MS: ${SESSION_WEBNFC_MAX_MS:-28800000}
      WEBNFC_LOGIN: ${WEBNFC_LOGIN:-true}
      SHELLY_TIMEOUT_MS: ${SHELLY_TIMEOUT_MS:-3000}
      SHELLY_HEALTH_INTERVAL_MS: ${SHELLY_HEALTH_INTERVAL_MS:-30000}
      TERMINAL_IDLE_TIMEOUT_MS: ${TERMINAL_IDLE_TIMEOUT_MS:-300000}
      TERMINAL_OFFLINE_AFTER_MS: ${TERMINAL_OFFLINE_AFTER_MS:-60000}
      # Explicit defaults: an empty value would mean "keep forever"
      USAGE_RETENTION_DAYS: ${USAGE_RETENTION_DAYS:-365}
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-365}
    depends_on:
      couchdb:
        condition: service_healthy
    healthcheck:
      # node:22-slim has no curl; use Node's built-in fetch instead
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    labels:
      - 'com.centurylinklabs.watchtower.enable=true'
    networks:
      - mks-network
    restart: unless-stopped

  frontend:
    image: ghcr.io/${GITHUB_OWNER}/mks-control-frontend:${TAG:-latest}
    container_name: mks-control-frontend
    ports:
      - '80:80'
    depends_on:
      backend:
        condition: service_healthy
    labels:
      - 'com.centurylinklabs.watchtower.enable=true'
    networks:
      - mks-network
    restart: unless-stopped

  # Finds Shellys in the network via mDNS and reports them to the backend (docs/shelly-plan.md,
  # phase 7). Needs the host network: multicast does not reach the Docker network.
  shelly-discovery:
    image: ghcr.io/${GITHUB_OWNER}/mks-control-backend:${TAG:-latest}
    container_name: mks-control-shelly-discovery
    network_mode: host
    command: ['npx', 'ts-node', '--transpile-only', 'src/shelly/discoveryRelay.ts']
    environment:
      BACKEND_URL: http://127.0.0.1:3000
      SHELLY_DISCOVERY_TOKEN: ${SHELLY_DISCOVERY_TOKEN:-}
      SHELLY_DISCOVERY_INTERVAL_MS: ${SHELLY_DISCOVERY_INTERVAL_MS:-60000}
    depends_on:
      backend:
        condition: service_healthy
    labels:
      - 'com.centurylinklabs.watchtower.enable=true'
    restart: unless-stopped

  # Nightly backup of all CouchDB databases as JSON to /opt/mks/backup (src/db/backup.ts)
  couchdb-backup:
    image: ghcr.io/${GITHUB_OWNER}/mks-control-backend:${TAG:-latest}
    container_name: mks-control-couchdb-backup
    command: ['npx', 'ts-node', '--transpile-only', 'src/db/backup.ts']
    environment:
      COUCHDB_URL: http://couchdb:5984
      COUCHDB_USER: ${COUCHDB_USER:-admin}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD:-password}
      BACKUP_DIR: /backup
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-30}
      # Hour in UTC
      BACKUP_HOUR: ${BACKUP_HOUR:-2}
    volumes:
      - /opt/mks/backup:/backup
    depends_on:
      couchdb:
        condition: service_healthy
    labels:
      - 'com.centurylinklabs.watchtower.enable=true'
    networks:
      - mks-network
    restart: unless-stopped

  nfc-bridge:
    image: ghcr.io/${GITHUB_OWNER}/mks-control-nfc-bridge:${TAG:-latest}
    container_name: mks-control-nfc-bridge
    environment:
      GATEWAY_URL: http://backend:3000
      POST_PATH: /api/auth/tag
      DEVICE_ID: ${NFC_DEVICE_ID:-prod-reader-01}
      SOURCE: acr122u
      DEBOUNCE_MS: ${NFC_DEBOUNCE_MS:-2000}
      # The entrance reader proves itself with the entrance key
      ENTRANCE_KEY: ${ENTRANCE_KEY:-}
    privileged: true
    volumes:
      - /run/pcscd:/run/pcscd
    depends_on:
      - backend
    labels:
      - 'com.centurylinklabs.watchtower.enable=true'
    networks:
      - mks-network
    restart: unless-stopped

  watchtower:
    image: containrrr/watchtower
    container_name: mks-control-watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /root/.docker:/config:ro
      - /opt/mks/docker-compose.prod.yml:/docker-compose.yml:ro
      - /opt/mks/.env:/.env:ro
    environment:
      WATCHTOWER_LABEL_ENABLE: 'true'
      WATCHTOWER_CLEANUP: 'true'
      WATCHTOWER_POLL_INTERVAL: '300'
      DOCKER_CONFIG: /config
      DOCKER_API_VERSION: '1.45'
    networks:
      - mks-network
    restart: unless-stopped

volumes:
  couchdb_data:
  couchdb_config:

networks:
  mks-network:
    name: mks-control-network
